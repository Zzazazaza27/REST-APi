version: '3.8'

services:
  # Container 1: PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: deribit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deribit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deribit_password}
      POSTGRES_DB: ${POSTGRES_DB:-deribit_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deribit_user} -d ${POSTGRES_DB:-deribit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Container 2: Application Container (FastAPI Web API + Celery Worker + Celery Beat Scheduler)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deribit_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_MODE: all-in-one
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-deribit_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deribit_password}
      POSTGRES_DB: ${POSTGRES_DB:-deribit_db}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      TRACKED_TICKERS: '["btc_usd", "eth_usd"]'
      FETCH_INTERVAL_SECONDS: 60.0
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
